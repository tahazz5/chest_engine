<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chest Engine · Play</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171c19;color:#edf1e7;font-family:system-ui,sans-serif}main{max-width:1080px;margin:7vh auto;padding:24px}header{margin-bottom:30px}.eyebrow{color:#a8bd87;font-size:12px;letter-spacing:3px}h1{font-size:42px;font-weight:500;margin:12px 0}p{color:#adb7aa;line-height:1.6}.layout{display:grid;grid-template-columns:minmax(280px,620px) 1fr;gap:40px;align-items:start}#board{display:grid;grid-template-columns:repeat(8,1fr);border:8px solid #30392f;border-radius:6px;overflow:hidden}.square{aspect-ratio:1;border:0;border-radius:0;padding:0;position:relative;font-family:'DejaVu Sans',serif;font-size:clamp(25px,5vw,58px);cursor:pointer;line-height:1;background:#e1e3ce;color:#171c19}.square.dark{background:#7c936b}.square.white{color:#fffdf1;text-shadow:0 2px 2px #333,1px 0 #333,-1px 0 #333}.square.selected{background:#e6c369}.square.target:after{content:'';position:absolute;width:23%;height:23%;background:#23372580;border-radius:50%;top:38%;left:38%}.square:focus-visible{outline:4px solid #e8bc53;outline-offset:-4px}.coord{position:absolute;bottom:3px;left:4px;font:10px system-ui;color:#263726;text-shadow:none}aside{padding-top:12px}#status{font-size:23px;margin:14px 0}button.action,select{background:#303d31;color:#edf1e7;border:1px solid #52624b;border-radius:6px;padding:12px 18px;font:inherit;cursor:pointer;margin:4px 6px 4px 0}button:disabled{opacity:.5;cursor:wait}#history{font-family:monospace;line-height:1.9;color:#a8bd87;overflow-wrap:anywhere}label{display:block;color:#adb7aa;margin:22px 0}small{color:#899783}@media(max-width:720px){main{margin:12px auto;padding:16px}.layout{grid-template-columns:1fr;gap:16px}h1{font-size:32px}.square{font-size:9vw}}
</style>
<main><header><div class="eyebrow">CHEST ENGINE / LOCAL PLAY</div><h1>A quiet place to think.</h1><p>Your chess engine, on a real board. Choose a piece, then its destination.</p></header>
<div class="layout"><div id="board" aria-label="Chessboard"></div><aside><small>YOU VS COMPUTER</small><div id="status" role="status">Starting engine…</div><p>You play White. Highlighted dots show legal destinations.</p><button class="action" id="reset">New game</button><button class="action" id="undo">Undo turn</button><label>Promote pawn to <select id="promotion"><option value="q">Queen</option><option value="r">Rook</option><option value="b">Bishop</option><option value="n">Knight</option></select></label><p id="reply"></p><small>YOUR MOVES</small><div id="history">—</div></aside></div></main>
<script>
const glyphs={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
let moves=[],state=null,selected=null,busy=false;
const el=id=>document.getElementById(id);
function draw(){el('board').replaceChildren();if(!state)return;[...state.board].forEach((piece,i)=>{const square='abcdefgh'[i%8]+(8-Math.floor(i/8));const b=document.createElement('button');b.className='square'+((Math.floor(i/8)+i%8)%2?' dark':'')+(piece!=='.'&&piece===piece.toUpperCase()?' white':'')+(selected===square?' selected':'')+(selected&&state.legal.some(m=>m.startsWith(selected+square))?' target':'');b.disabled=busy;b.setAttribute('aria-label',square+' '+(piece==='.'?'empty':piece));b.textContent=glyphs[piece]||'';const c=document.createElement('span');c.className='coord';c.textContent=square;b.append(c);b.onclick=()=>click(square);el('board').append(b)});el('undo').disabled=busy||!moves.length;el('reset').disabled=busy;el('history').textContent=moves.join('  ')||'—'}
async function update(next){busy=true;selected=null;el('status').textContent='Thinking…';draw();try{const r=await fetch('/position',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({moves:next})});const data=await r.json();if(!r.ok)throw Error(data.error);state=data;moves=next;el('status').textContent=data.status;el('reply').textContent=data.reply.length?'Computer played '+data.reply[0]:''}catch(e){el('status').textContent='Could not update: '+e.message}finally{busy=false;draw()}}
function click(square){if(busy)return;const candidates=selected?state.legal.filter(m=>m.startsWith(selected+square)):[];if(candidates.length){const move=candidates.find(m=>m.length===4||m[4]===el('promotion').value);if(move)update([...moves,move]);return}selected=state.legal.some(m=>m.startsWith(square))?square:null;draw()}
el('reset').onclick=()=>update([]);el('undo').onclick=()=>update(moves.slice(0,-1));update([]);
</script>
</html>
